# SPDX-License-Identifier: Apache-2.0
# Keep the verified 1.12.0 upstream image until an ECR image has been published.
# Replace only this image with <frontend_repository_url>:<full-commit-sha>.
# A targeted patch avoids changing other services sharing the same GHCR image name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          image: ghcr.io/open-telemetry/demo:1.12.0-frontend
