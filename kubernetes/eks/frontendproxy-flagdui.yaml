# Required proxy configuration from upstream PR #1766.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-frontendproxy
spec:
  template:
    spec:
      containers:
        - name: frontendproxy
          env:
            - name: FLAGD_UI_HOST
              value: opentelemetry-demo-flagd
            - name: FLAGD_UI_PORT
              value: "4000"
